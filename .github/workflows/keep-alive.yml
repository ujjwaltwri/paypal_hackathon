# Pings the Render deployment every 10 minutes so the free instance stays awake
# (and wakes it if it has already spun down).
# Setup: GitHub repo > Settings > Secrets and variables > Actions > Variables >
#        New repository variable  RENDER_URL = https://your-app.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - name: Ping
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 "${{ vars.RENDER_URL }}/api/ping" || echo "ping failed"
